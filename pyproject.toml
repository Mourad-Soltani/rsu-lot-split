[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsu-lot-split"
version = "0.1.0"
description = "RSU vesting tax-lot splitter for cost basis and holding period."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mourad.Soltani" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rsu-lot-split = "rsu_lot_split.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
